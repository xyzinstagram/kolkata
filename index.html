<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Ek Jholoke Kolkata | West Bengal Heritage & Lifestyle Gallery</title>

    <meta name="description" content="Discover the soul of West Bengal. From the streets of Kolkata to the hills of Darjeeling. Every blink tells a story.">
    
    <meta http-equiv="refresh" content="20;url=https://ekjholokekolkata.page.gd">

    <style>
        body { background: #000; color: #ffd700; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; text-align: center; }
        .main-content { padding: 20px; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #ffd700; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 25px; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        a { color: #fff; text-decoration: none; border-bottom: 1px solid #ffd700; }
        .seo-text { max-width: 800px; margin-top: 30px; font-size: 0.9rem; color: #888; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="loader"></div>
        <h1>Ek Jholoke Kolkata</h1>
        <p>Redirecting to our main gallery in <span id="countdown">20</span> seconds...</p>
        <p><a href="https://ekjholokekolkata.page.gd">Click here to enter now</a></p>
        
        <div class="seo-text">
            Welcome to <strong>Ek Jholoke Kolkata</strong>. We showcase the vibrant culture of <strong>West Bengal</strong>, 
            covering <strong>Durga Pujo</strong>, <strong>Kolkata street food</strong>, and the heritage of all 23 districts.
        </div>
    </div>

    <script>
        let seconds = 20;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (seconds >= 0) countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "https://ekjholokekolkata.page.gd";
            }
        }, 1000);
    </script>

</body>
</html>
